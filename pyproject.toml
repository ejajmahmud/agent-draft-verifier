[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-draft-verifier"
version = "0.1.0"
description = "Dual-model draft verification harness pairing a lightweight generator with an authoritative verification critic"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-draft-verifier = "agent_draft_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_draft_verifier*"]
